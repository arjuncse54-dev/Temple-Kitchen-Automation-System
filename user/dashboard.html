<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/user.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="logo">
            <h2>Temple Monitor</h2>
        </div>
        <ul>

    <li class="active">
        <a href="dashboard.html">
            <i class="fa-solid fa-house"></i>
            Dashboard
        </a>
    </li>

 

    <li>
        <a href="profile.html">
            <i class="fa-solid fa-user"></i>
            Profile
        </a>
    </li>

    <li>
        <a href="../login.html">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </a>
    </li>

</ul>

      

    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- TOPBAR -->
        <div class="topbar">

            <h1>User Dashboard</h1>

            <div class="top-right">

                <div class="clock" id="clock">
                    00:00:00
                </div>

                <div class="bell ringing" id="bell">
                    <i class="fa-solid fa-bell"></i>
                </div>
            

            </div>

        </div>

        <!-- STATISTICS -->
        <div class="cards">

            <div class="card">
                <h3>Total Alerts</h3>
                <p id="totalAlerts">0</p>
            </div>

            <div class="card">
                <h3>Total Warnings</h3>
                <p id="totalWarnings">0</p>
            </div>

            <div class="card">
                <h3>Alert Status</h3>
                <p id="alertStatus">Inactive</p>
            </div>

            <div class="card">
                <h3>Today Alerts</h3>
                <p id="todayAlerts">0</p>
            </div>

        </div>

        <!-- CONTENT AREA -->
        <div class="content-area">

            <!-- NOTIFICATIONS -->
            <div class="notifications">

                <h2>Notifications</h2>

               <div id="notificationsContainer">

</div>

            </div>

            <!-- WARNINGS -->
            <div class="warnings">

                <h2>Personal Warnings</h2>

                <div id="warningsContainer">

</div>

                <!-- STOP ALERT BUTTON -->
                <button id="stopBtn">
                    Stop Alert Ring
                </button>

            </div>

        </div>

        <!-- PROFILE SECTION -->
       

    </div>
    <!-- CUSTOM POPUP -->

<div class="custom-popup" id="popup">

    <i class="fa-solid fa-circle-check"></i>

    <span id="popupText">
        Alert Stopped Successfully!
    </span>

</div>

<audio id="alertSound">

    <source src="../audio/alert.mp3"
    type="audio/mpeg">

</audio>

    <!-- JS -->
    <script src="../js/user.js"></script>

</body>
</html>
