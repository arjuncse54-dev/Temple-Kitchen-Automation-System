<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Kitchen Monitoring</title>

    <!-- CSS FILE -->
    <link rel="stylesheet" href="css/style.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    

    <!-- LOGIN CONTAINER -->
    <div class="login-container">
        <h1 id="login"> Login </h1>

        <!-- LOGO -->
        <div class="logo-section">
            <img src="image/temple-logo.png.jpeg" alt="Temple Logo" class="logo">
            <h1>Temple Kitchen Monitoring</h1>
            <p>PPE Detection & Safety Alert System</p>
        </div>

        <!-- LOGIN FORM -->
       <form
class="login-form"
id="loginForm">

            <!-- EMAIL -->
            <div class="input-box">
                <label>Email</label>
               <input
type="email"
id="email"
placeholder="Enter your email"
required>
            </div>

            <!-- PASSWORD -->
            <div class="input-box">
                <label>Password</label>
               <input
type="password"
id="password"
placeholder="Enter your password"
required>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" id="loginBtn">
                Login
            </button>

        </form>

    </div>

    <!-- JS FILE -->
    <script src="js/login.js"></script>

</body>
</html>
